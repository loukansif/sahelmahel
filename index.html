  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Cairo:wght@400;600;700;900&display=swap');

    * {
      font-family: 'Inter', sans-serif;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.35s ease, color 0.35s ease;
    }

    body.theme-dark {
      background: #0d0d1a;
      color: #fff;
    }

    body.theme-light {
      background: linear-gradient(180deg, #f6f3ff 0%, #fff7fb 100%);
      color: #1f2340;
    }

    @keyframes slot-roll {

      0%,
      100% {
        transform: translateY(0);
        opacity: 1;
      }

      25% {
        transform: translateY(-30px);
        opacity: 0;
      }

      26% {
        transform: translateY(30px);
        opacity: 0;
      }

      75% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes winner-pop {
      0% {
        transform: scale(0.3) rotate(-10deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.15) rotate(3deg);
        opacity: 1;
      }

      80% {
        transform: scale(0.95) rotate(-1deg);
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes glow-pulse {

      0%,
      100% {
        box-shadow: 0 0 20px rgba(var(--pal-rgb), .35), 0 0 40px rgba(var(--pal-rgb2), .18);
      }

      50% {
        box-shadow: 0 0 40px rgba(var(--pal-rgb3), .42), 0 0 80px rgba(var(--pal-rgb), .25), 0 0 120px rgba(var(--pal-rgb2), .18);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes shimmer {
      0% {
        background-position: -200% center;
      }

      100% {
        background-position: 200% center;
      }
    }

    @keyframes tag-in {
      0% {
        transform: scale(0) rotate(-10deg);
        opacity: 0;
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      20% {
        transform: translateX(-6px)
      }

      40% {
        transform: translateX(6px)
      }

      60% {
        transform: translateX(-4px)
      }

      80% {
        transform: translateX(4px)
      }
    }

    @keyframes fade-slide-in {
      0% {
        opacity: 0;
        transform: translateY(20px)
      }

      100% {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .winner-pop {
      animation: winner-pop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .glow-pulse {
      animation: glow-pulse 1.5s ease-in-out infinite;
    }

    .float {
      animation: float 3s ease-in-out infinite;
    }

    .slot-rolling {
      animation: slot-roll 0.12s linear infinite;
    }

    .tag-in {
      animation: tag-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .shake {
      animation: shake 0.5s ease-in-out;
    }

    .fade-slide-in {
      animation: fade-slide-in 0.4s ease forwards;
    }

    .theme-dark .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
    }

    .theme-light .glass {

      backdrop-filter: blur(14px);
      border: 1px solid rgba(124, 58, 237, 0.12);
      box-shadow: 0 20px 45px rgba(116, 85, 255, 0.12);
    }

    /* ═══ PALETTE SYSTEM ═══ */
    :root {
      --pal-primary: #7c3aed;
      --pal-mid: #a855f7;
      --pal-accent: #ec4899;
      --pal-extra: #f97316;
      --pal-rgb: 168, 85, 247;

    .winner-text {

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 2s linear infinite;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pal-primary), var(--pal-mid), var(--pal-accent));
      background-size: 200% 200%;
      transition: all 0.3s ease;
      box-shadow: 0 16px 30px rgba(var(--pal-rgb), 0.22);
    }

    .btn-primary:hover {
      background-position: right center;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(var(--pal-rgb), 0.5);
    }

    .btn-primary:active {
      transform: translateY(0px) scale(0.98);
    }

    .theme-dark .input-field {
      background: rgba(255, 255, 255, 0.07);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      color: white;
    }

    .theme-light .input-field {
      background: rgba(255, 255, 255, 0.85);
      border: 1.5px solid rgba(124, 58, 237, 0.12);
      color: #1f2340;
    }

    .input-field {
      transition: all 0.2s ease;
      font-size: 16px !important;
    }

    .input-field:focus {

      border-color: var(--pal-mid);
      box-shadow: 0 0 0 3px rgba(var(--pal-rgb), 0.2);
    }

    .theme-dark .input-field::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .theme-light .input-field::placeholder {
      color: rgba(31, 35, 64, 0.35);
    }

    .theme-dark .slot-display {
      background: linear-gradient(135deg, rgba(var(--pal-rgb2), 0.15), rgba(var(--pal-rgb3), 0.15));
      border: 2px solid rgba(var(--pal-rgb), 0.3);
    }

    .theme-light .slot-display {
      background: linear-gradient(135deg, rgba(var(--pal-rgb2), 0.09), rgba(var(--pal-rgb3), 0.08));
      border: 2px solid rgba(var(--pal-rgb), 0.16);
    }

    .slot-display {
      position: relative;
      overflow: hidden;
      transition: background .35s ease, border-color .35s ease;
    }

    .theme-dark .slot-display::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(13, 13, 26, 0.8) 0%, transparent 30%, transparent 70%, rgba(13, 13, 26, 0.8) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .theme-light .slot-display::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(to bottom, rgba(246, 243, 255, 0.85) 0%, transparent 30%, transparent 70%, rgba(255, 247, 251, 0.9) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .theme-dark .muted {
      color: rgba(196, 181, 253, 0.72);
    }

    .theme-light .muted {
      color: rgba(91, 58, 170, 0.76);
    }

    .theme-dark .soft {

    .theme-light .soft {

    }

    .theme-light .subtle-bg {

    }

    .icon-btn {
      width: 40px;

      border-radius: 12px;

    /* ═══════════════════════════════════════════════════
       COOKIECONSENT v3 — UI/UX moderne, style SahelMahel
       Utilise les CSS vars --pal-* de la palette choisie
       ═══════════════════════════════════════════════════ */

    /* ── Variables dark (défaut) — basées sur --pal-* ── */
    #cc-main {
      --cc-font-family: 'Inter', sans-serif;

      /* Couleurs palette → variables CC */
      --cc-btn-primary-bg:              var(--pal-primary);
      --cc-btn-primary-hover-bg:        var(--pal-mid);
      --cc-btn-primary-color:           #fff;
      --cc-btn-primary-border-color:    transparent;
      --cc-primary-color:               var(--pal-mid);
      --cc-toggle-on-bg:                var(--pal-primary);
      --cc-toggle-readonly-bg:          rgba(var(--pal-rgb2), 0.35);

      /* Fond dark */
      --cc-bg:                          rgba(13, 13, 26, 0.92);
      --cc-secondary-bg:                rgba(255, 255, 255, 0.04);
      --cc-overlay-bg:                  rgba(0, 0, 0, 0.55);

      /* Texte dark */
      --cc-text:                        rgba(255, 255, 255, 0.88);
      --cc-secondary-color:             rgba(255, 255, 255, 0.55);

      /* Bouton secondaire dark */
      --cc-btn-secondary-bg:            rgba(255, 255, 255, 0.06);
      --cc-btn-secondary-hover-bg:      rgba(255, 255, 255, 0.11);
      --cc-btn-secondary-color:         rgba(255, 255, 255, 0.82);
      --cc-btn-secondary-border-color:  rgba(255, 255, 255, 0.1);

      /* Toggle dark */
      --cc-toggle-off-bg:               rgba(255, 255, 255, 0.14);
      --cc-toggle-on-knob-bg:           #fff;
      --cc-toggle-off-knob-bg:          rgba(255, 255, 255, 0.7);

      /* Blocs catégories dark */
      --cc-cookie-category-block-bg:           rgba(255, 255, 255, 0.04);
      --cc-cookie-category-block-border:       rgba(255, 255, 255, 0.07);
      --cc-cookie-category-block-hover-bg:     rgba(var(--pal-rgb2), 0.1);
      --cc-cookie-category-block-hover-border: rgba(var(--pal-rgb), 0.3);

      /* Séparateurs dark */
      --cc-separator-border-color:      rgba(255, 255, 255, 0.07);

      /* Géométrie */
      --cc-modal-border-radius:         20px;
      --cc-btn-border-radius:           12px;
      --cc-modal-transition-duration:   0.28s;
    }

    /* ── Variables light ── */
    body.theme-light #cc-main {
      --cc-bg:                          rgba(250, 248, 255, 0.97);
      --cc-secondary-bg:                rgba(var(--pal-rgb2), 0.04);
      --cc-text:                        #1f2340;
      --cc-secondary-color:             rgba(var(--pal-rgb2), 0.7);
      --cc-btn-secondary-bg:            rgba(var(--pal-rgb2), 0.07);
      --cc-btn-secondary-hover-bg:      rgba(var(--pal-rgb2), 0.14);
      --cc-btn-secondary-color:         var(--pal-primary);
      --cc-btn-secondary-border-color:  rgba(var(--pal-rgb2), 0.2);
      --cc-cookie-category-block-bg:    rgba(var(--pal-rgb2), 0.04);
      --cc-cookie-category-block-border:rgba(var(--pal-rgb2), 0.1);
      --cc-cookie-category-block-hover-bg:    rgba(var(--pal-rgb2), 0.08);
      --cc-cookie-category-block-hover-border:rgba(var(--pal-rgb), 0.3);
      --cc-separator-border-color:      rgba(var(--pal-rgb2), 0.1);
      --cc-toggle-off-bg:               rgba(var(--pal-rgb2), 0.15);
    }

    /* ── Modal consentement — glass morphism ── */
    #cc-main .cm {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(var(--pal-rgb), 0.2);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(var(--pal-rgb), 0.07);
    }
    body.theme-light #cc-main .cm {
      border: 1px solid rgba(var(--pal-rgb2), 0.15);
      box-shadow: 0 20px 50px rgba(var(--pal-rgb), 0.12);
    }

    /* ── Titre ── */
    #cc-main .cm__title { font-weight: 800; font-size: 15px; letter-spacing: -0.01em; }

    /* ── Description ── */
    #cc-main .cm__desc { font-size: 12.5px; line-height: 1.65; }

    /* ── Bouton primaire : dégradé palette animé ── */
    #cc-main .cm__btn[data-role="all"],
    #cc-main .pm__btn[data-role="all"],
    #cc-main .pm__btn[data-role="save"] {
      background: linear-gradient(135deg, var(--pal-primary), var(--pal-mid), var(--pal-accent)) !important;
      background-size: 200% 200% !important;

      }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';

    /* ── Audio ─────────────────────────────────────────────────────────────────── */

    function createAudioContext() {
      return new (window.AudioContext || window.webkitAudioContext)();
    }

    function playDrumRoll(duration = 2800) {
      const ctx = createAudioContext();
      const gainNode = ctx.createGain();
      gainNode.connect(ctx.destination);
      let time = ctx.currentTime;
      const totalBeats = Math.floor(duration / 80);
      for (let i = 0; i < totalBeats; i++) {
        const progress = i / totalBeats;
        const interval = 0.08 * (1 + progress * 1.5);
        const bufferSize = ctx.sampleRate * 0.04;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let j = 0; j < bufferSize; j++) {
          data[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufferSize * 0.15));
        }
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 180 + Math.random() * 40;
        filter.Q.value = 0.8;
        source.connect(filter);
        filter.connect(gainNode);
        gainNode.gain.setValueAtTime(0.35, time);
        source.start(time);
        time += interval * (1 - progress * 0.4);
      }
      return ctx;
    }

    function playVictorySound() {
      const ctx = createAudioContext();
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.55, ctx.currentTime);
      master.connect(ctx.destination);

      const pingFreqs = [880, 1100, 1320, 1760];
      pingFreqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq * 0.5, ctx.currentTime + i * 0.06);
        osc.frequency.exponentialRampToValueAtTime(freq, ctx.currentTime + i * 0.06 + 0.08);
        gain.gain.setValueAtTime(0.35, ctx.currentTime + i * 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.55);
        osc.connect(gain); gain.connect(master);
        osc.start(ctx.currentTime + i * 0.06);
        osc.stop(ctx.currentTime + i * 0.06 + 0.6);
      });

      const kick = ctx.createOscillator();
      const kickGain = ctx.createGain();
      kick.type = 'sine';
      kick.frequency.setValueAtTime(160, ctx.currentTime);
      kick.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.18);
      kickGain.gain.setValueAtTime(0.7, ctx.currentTime);
      kickGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
      kick.connect(kickGain); kickGain.connect(master);
      kick.start(ctx.currentTime); kick.stop(ctx.currentTime + 0.25);

      for (let i = 0; i < 6; i++) {
        const bufSize = ctx.sampleRate * 0.06;
        const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let j = 0; j < bufSize; j++) d[j] = (Math.random() * 2 - 1) * Math.exp(-j / (bufSize * 0.12));
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'highpass'; filter.frequency.value = 3000 + Math.random() * 2000;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.22 + Math.random() * 0.15, ctx.currentTime);
        src.connect(filter); filter.connect(g); g.connect(master);
        src.start(ctx.currentTime + 0.05 + i * 0.09 + Math.random() * 0.04);
      }

      const chordFreqs = [523, 659, 784];
      chordFreqs.forEach((freq) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 1200;
        osc.frequency.setValueAtTime(freq, ctx.currentTime + 0.28);
        gain.gain.setValueAtTime(0, ctx.currentTime + 0.28);
        gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.35);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
        osc.connect(filter); filter.connect(gain); gain.connect(master);
        osc.start(ctx.currentTime + 0.28);
        osc.stop(ctx.currentTime + 1.0);
      });
    }

    async function shareLink(shareText, fallbackMsg) {
      const url = 'https://www.sahelmahel.com/';
      try {
        if (navigator.share) {
          await navigator.share({ title: 'Qui paye ?', text: shareText, url });
        } else {
          await navigator.clipboard.writeText(shareText + '\n' + url);
          alert(fallbackMsg);
        }
      } catch (e) {
        if (e.name !== 'AbortError') {
          await navigator.clipboard.writeText(shareText + '\n' + url);
          alert(fallbackMsg);
        }
      }
    }

    function getAvatar(name) {
      let hash = 0;
      for (let c of name) hash = (hash * 31 + c.charCodeAt(0)) % AVATARS.length;
      return AVATARS[hash];
    }

    function launchConfetti(palette) {
      const pal = PALETTES.find(p => p.key === palette) || PALETTES[0];
      const colors = [pal.vars.primary, pal.vars.mid, pal.vars.accent, pal.vars.extra, '#fbbf24', '#34d399'];
      const opts = { particleCount: 120, spread: 80, origin: { y: 0.6 }, colors };
      confetti({ ...opts, angle: 60, origin: { x: 0, y: 0.7 } });
      setTimeout(() => confetti({ ...opts, angle: 120, origin: { x: 1, y: 0.7 } }), 200);
      setTimeout(() => confetti({ ...opts, particleCount: 60, origin: { x: 0.5, y: 0.5 } }), 400);
    }

    function App() {
      const [input, setInput] = useState('');
      const [names, setNames] = useState([]);
      const [phase, setPhase] = useState('idle');
      const [currentName, setCurrentName] = useState('');
      const [winner, setWinner] = useState('');
      const [sharing, setSharing] = useState(false);
      const [history, setHistory] = useState([]);
      const [showHistory, setShowHistory] = useState(false);
      const [shake, setShake] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(localStorage.getItem('qui-paye-sound') !== 'false');
      const [lang, setLang] = useState(localStorage.getItem('qui-paye-lang') || 'FR');
      const [theme, setTheme] = useState(localStorage.getItem('qui-paye-theme') || 'dark');
      const [modal, setModal] = useState(null);
      const [palette, setPalette] = useState(() => {
        const saved = localStorage.getItem('qui-paye-palette') || 'violet';
        const found = PALETTES.find(p => p.key === saved) || PALETTES[0];
        applyPalette(found);
        return found.key;
      });

      const inputRef = useRef(null);
      const rollRef = useRef(null);
      const t = TEXT[lang];
      const isArabic = lang === 'AR';

      useEffect(() => {
        localStorage.setItem('qui-paye-sound', soundEnabled);
        document.body.classList.remove('theme-dark', 'theme-light');
        document.body.classList.add(theme === 'dark' ? 'theme-dark' : 'theme-light');
        localStorage.setItem('qui-paye-theme', theme);
      }, [theme, soundEnabled]);

      useEffect(() => {
        localStorage.setItem('qui-paye-lang', lang);
        document.documentElement.lang = lang.toLowerCase();
        document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
        // ── Sync bannière cookies avec la langue de l'app ──
        if (window.updateCCLang) window.updateCCLang(lang);
      }, [lang, isArabic]);

      const notifyShake = () => {
        setShake(true);
        setTimeout(() => setShake(false), 600);
      };

      const normalizedNames = useMemo(() => names.map(n => n.toLowerCase()), [names]);

      const addName = useCallback(() => {
        const trimmed = input.trim();
        if (!trimmed) return;
        if (normalizedNames.includes(trimmed.toLowerCase())) { notifyShake(); return; }
        setNames(prev => [...prev, trimmed]);
        setInput('');
        inputRef.current?.focus();
      }, [input, normalizedNames]);

      const removeName = useCallback((name) => {
        setNames(prev => prev.filter(n => n !== name));
        if (winner === name) { setWinner(''); setPhase('idle'); }
      }, [winner]);

      const handleKey = (e) => { if (e.key === 'Enter') addName(); };

      const draw = useCallback(() => {
        if (names.length < 2) { notifyShake(); return; }
        setPhase('rolling');
        setWinner('');
        const picked = names[Math.floor(Math.random() * names.length)];
        if (soundEnabled) { try { playDrumRoll(2800); } catch (e) { } }
        let elapsed = 0;
        const totalDuration = 2800;
        const interval = 80;
        rollRef.current = setInterval(() => {
          elapsed += interval;
          setCurrentName(names[Math.floor(Math.random() * names.length)]);
          if (elapsed >= totalDuration) {
            clearInterval(rollRef.current);
            setCurrentName(picked);
            setWinner(picked);
            setPhase('winner');
            setShowHistory(true);
            setHistory(prev => [{
              name: picked,
              time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }),
              emoji: EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
            }, ...prev.slice(0, 9)]);
            setTimeout(() => launchConfetti(palette), 100);
            if (soundEnabled) { try { playVictorySound(); } catch (e) { } }
          }
        }, interval);
      }, [names, palette, soundEnabled]);

      useEffect(() => () => clearInterval(rollRef.current), []);

      const handleShare = async () => {
        setSharing(true);
        await shareLink(t.shareText, t.shareFallback);
        setSharing(false);
      };

      return (
        <div className="w-full max-w-sm mx-auto p-4 flex flex-col gap-4" style={{ minHeight: '100vh', paddingTop: '2rem', paddingBottom: '80px' }} dir={isArabic ? 'rtl' : 'ltr'}>

          {/* Header */}
          <div className="flex items-start justify-between gap-3">
            <div className="header-title">
              <h1
                className={`font-black plain-text tracking-tight ${lang === 'ES' || lang === 'TZM' ? 'text-2xl mt-[7px]' : 'text-3xl'} whitespace-nowrap`}
                style={{ lineHeight: 1.1 }}>
                {t.title}
              </h1>
              <p className="muted text-xs mt-0.5">{t.subtitle}</p>
            </div>
            <div dir="ltr">
              <HeaderActions
                t={t}
                lang={lang}
                setLang={setLang}
                theme={theme}
                setTheme={setTheme}
                isArabic={isArabic}
                soundEnabled={soundEnabled}
                setSoundEnabled={setSoundEnabled}
                palette={palette}
                setPalette={setPalette}
              />
            </div>
          </div>

          {/* Input */}
          <div className="glass glass-card rounded-2xl p-4 flex flex-col gap-3">
            <p className="title-soft text-xs font-semibold uppercase tracking-widest">{t.addFriends}</p>
            <div className={`flex gap-2 ${shake ? 'shake' : ''}`} dir="ltr">
              <input
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={handleKey}
                placeholder={t.placeholder}
                className="input-field flex-1 px-4 py-2.5 rounded-xl text-sm font-medium"
                style={{ textAlign: isArabic ? 'right' : 'left', direction: isArabic ? 'rtl' : 'ltr' }}
              />
              <button
                onClick={addName}
                className="btn-primary w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold text-xl flex-shrink-0 shadow-lg"
                aria-label={t.addFriends}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                  <circle cx="12" cy="7" r="4" />
                  <line x1="12" y1="1" x2="12" y2="5" strokeLinecap="round" />
                  <line x1="10" y1="3" x2="14" y2="3" strokeLinecap="round" />
                </svg>
              </button>
            </div>
            {names.length > 0 && (
              <div className={`flex flex-wrap gap-2 pt-1 ${isArabic ? 'justify-end' : ''}`}>
                {names.map(n => <Tag key={n} name={n} onRemove={removeName} />)}
              </div>
            )}
            {names.length < 2 && (
              <p className="muted text-xs text-center">{t.helper}</p>
            )}
          </div>

          {/* Slot */}
          <SlotDisplay phase={phase} currentName={currentName} winner={winner} t={t} isArabic={isArabic} />

          {/* CTA */}
          <div className="flex flex-col gap-2">
            <button
              onClick={draw}
              disabled={phase === 'rolling'}
              className="cta-btn btn-primary w-full py-4 rounded-2xl text-white font-black text-lg tracking-wide shadow-xl disabled:opacity-60 disabled:cursor-not-allowed flex items-center justify-center gap-2">
              {phase === 'rolling'
                ? <><span className="animate-spin text-xl">🎲</span><span>{t.drawing}</span></>
                : <span>{t.cta}</span>
              }
            </button>
            <div className={`flex gap-2 ${isArabic ? 'flex-row-reverse' : ''}`}>
              <button
                onClick={() => window.open('QRcode.pdf', '_blank')}
                className="qr-share-btn flex-1 py-3 rounded-xl title-soft font-semibold text-sm glass hover:bg-purple-500/20 transition-all flex items-center justify-center gap-1.5">
                <span>📱</span><span>{t.qrcode}</span>
              </button>
              <button
                onClick={handleShare}
                disabled={sharing}
                className="qr-share-btn flex-1 py-3 rounded-xl title-soft font-semibold text-sm glass hover:bg-purple-500/20 transition-all disabled:opacity-60 flex items-center justify-center gap-1.5">
                {sharing ? <span className="animate-spin">⏳</span> : <span>🔗</span>}
                <span>{t.share}</span>
              </button>
            </div>
          </div>

          {/* Historique */}
          {showHistory && history.length > 0 && (
            <div className="glass glass-card rounded-2xl p-4 flex flex-col gap-3">
              <div>
                <p className="title-soft text-xs font-semibold uppercase tracking-widest">{t.history}</p>
              </div>
              <div className="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                {history.map((h, i) => (
                  <div key={i} className="history-card flex items-center justify-between px-3 py-2 rounded-xl subtle-bg">
                    <div className={`flex gap-2 ${shake ? 'shake' : ''}`} dir="ltr">
                      <span className="plain-text font-semibold text-sm">{h.name}</span>
                    </div>
                    <span className="muted text-xs">{h.time}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {winner && <span className="sr-only">{t.resultLabel(winner)}</span>}

          {/* Footer légal */}
          <div style={{
            position: 'fixed', bottom: 0, left: 0, right: 0,
            zIndex: 998, padding: '8px 12px 10px', textAlign: 'center',
            backdropFilter: 'blur(10px)', WebkitBackdropFilter: 'blur(10px)',
            borderTop: theme === 'dark' ? '1px solid rgba(168,85,247,0.2)' : '1px solid rgba(124,58,237,0.15)',
            background: theme === 'dark' ? 'rgba(13,13,26,0.85)' : 'rgba(240,235,255,0.92)'
          }} dir="ltr">
            <div className="flex flex-wrap justify-center gap-x-3 gap-y-1">
              {[{ label: t.footerMentions, key: 'mentions' }, { label: t.footerPrivacy, key: 'confidentialite' }, { label: t.footerCgu, key: 'cgv' }].map(({ label, key }) => (
                <button key={key} onClick={() => setModal(key)}
                  style={{ fontSize: '11px', whiteSpace: 'nowrap', color: theme === 'dark' ? 'rgba(196,181,253,0.8)' : 'rgba(91,58,170,0.85)', background: 'none', border: 'none', cursor: 'pointer', padding: 0, textDecoration: 'none' }}
                  onMouseEnter={e => e.target.style.textDecoration = 'underline'}
                  onMouseLeave={e => e.target.style.textDecoration = 'none'}>
                  {label}
                </button>
              ))}
              <span style={{ fontSize: '11px', color: theme === 'dark' ? 'rgba(196,181,253,0.4)' : 'rgba(91,58,170,0.4)' }}>·</span>
              <button
                onClick={() => window.CookieConsent && window.CookieConsent.showPreferences()}
                style={{ fontSize: '11px', whiteSpace: 'nowrap', color: theme === 'dark' ? 'rgba(196,181,253,0.8)' : 'rgba(91,58,170,0.85)', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
                onMouseEnter={e => e.target.style.textDecoration = 'underline'}
                onMouseLeave={e => e.target.style.textDecoration = 'none'}>
                {t.footerCookies}
              </button>
            </div>
            <p style={{ fontSize: '10px', marginTop: '3px', margin: '3px 0 0', color: theme === 'dark' ? 'rgba(196,181,253,0.45)' : 'rgba(91,58,170,0.5)' }}>
              © {new Date().getFullYear()} SahelMahel — {t.footerRights}
            </p>
          </div>

          {/* Modal légal */}
          {modal && <LegalModal type={modal} onClose={() => setModal(null)} theme={theme} lang={lang} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>


  <!-- ═══ COOKIECONSENT v3 — initialisation ═══ -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {

      // Détecte la langue actuelle de l'app (stockée par React)
      function getCCLang() {
        var saved = localStorage.getItem('qui-paye-lang') || 'FR';
        var map = { FR: 'fr', AR: 'ar', EN: 'en', IT: 'it', ES: 'es', TZM: 'fr' };
        return map[saved] || 'fr';

      // ── Applique la palette sauvegardée à la bannière au chargement ──
      (function() {
        var savedKey = localStorage.getItem('qui-paye-palette') || 'violet';
        var palMap = {
          violet:   { primary: '#7c3aed', mid: '#a855f7', accent: '#ec4899', extra: '#f97316', rgb: '168,85,247', rgb2: '124,58,237', rgb3: '236,72,153' },
          ocean:    { primary: '#0369a1', mid: '#0ea5e9', accent: '#06b6d4', extra: '#38bdf8', rgb: '14,165,233',  rgb2: '3,105,161',  rgb3: '6,182,212'  },

          sunset:   { primary: '#b91c1c', mid: '#ef4444', accent: '#f97316', extra: '#fbbf24', rgb: '239,68,68',  rgb2: '185,28,28',  rgb3: '249,115,22' },
          gold:     { primary: '#92400e', mid: '#d97706', accent: '#f59e0b', extra: '#fcd34d', rgb: '217,119,6',  rgb2: '146,64,14',  rgb3: '245,158,11' },
          rose:     { primary: '#9f1239', mid: '#e11d48', accent: '#f43f5e', extra: '#fb7185', rgb: '244,63,94',  rgb2: '159,18,57',  rgb3: '251,113,133'},
          indigo:   { primary: '#4338ca', mid: '#6366f1', accent: '#818cf8', extra: '#a78bfa', rgb: '99,102,241', rgb2: '67,56,202',  rgb3: '129,140,248'}
        };
        var vars = palMap[savedKey] || palMap.violet;
        // Applique sur :root pour que les var(--pal-*) dans #cc-main fonctionnent immédiatement
        var r = document.documentElement.style;
        r.setProperty('--pal-primary', vars.primary);
        r.setProperty('--pal-mid',     vars.mid);
        r.setProperty('--pal-accent',  vars.accent);
        r.setProperty('--pal-extra',   vars.extra);
        r.setProperty('--pal-rgb',     vars.rgb);
        r.setProperty('--pal-rgb2',    vars.rgb2);
        r.setProperty('--pal-rgb3',    vars.rgb3);
      })();

      CookieConsent.run({

        // ── Pas de re-demande si déjà consenti ──────────────────
        // CookieConsent v3 gère ça nativement :
        // si un cookie "cc_cookie" existe, le modal NE s'affiche PLUS.
        // Le bouton "Cookies" du footer appelle showPreferences() pour modifier.

        revision: 1, // Incrémenter si tu changes la politique pour forcer un re-consentement

        guiOptions: {
          consentModal: {
            layout: 'box',
            position: 'bottom left',
            equalWeightButtons: false,
            flipButtons: false,
            disablePageInteraction: false
          },
          preferencesModal: {
            layout: 'box',
            equalWeightButtons: false,
            flipButtons: false
          }
        },

        onFirstConsent: function () {
          updateGAConsent(CookieConsent.acceptedCategory('analytics'));
        },
        onConsent: function () {
          updateGAConsent(CookieConsent.acceptedCategory('analytics'));
        },
        onChange: function () {
          updateGAConsent(CookieConsent.acceptedCategory('analytics'));
        },

        categories: {
          necessary: {
            enabled: true,
            readOnly: true
          },
          analytics: {
            enabled: false,
            autoClear: {
              cookies: [
                { name: /^_ga/ },
                { name: '_gid' }
              ]
            }
          }
        },

        language: {
          default: getCCLang(),
          translations: {
            fr: {
              consentModal: {
                title: '🍪 Cookies',

                acceptAllBtn: 'Tout accepter',
                acceptNecessaryBtn: 'Refuser',
                showPreferencesBtn: 'Personnaliser ›',
              },
              preferencesModal: {
                title: '⚙️ Préférences cookies',
                acceptAllBtn: 'Tout accepter',
                acceptNecessaryBtn: 'Tout refuser',
                savePreferencesBtn: '✓ Enregistrer mes choix',
                closeIconLabel: 'Fermer',
